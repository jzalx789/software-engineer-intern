services:
  api:
    build:
      context: ..
      dockerfile: q3_deploy/Dockerfile
    env_file: .env
    environment:
      DATABASE_PATH: /var/lib/identity/service.db
      OCR_URL: http://mock_ocr:9100/ocr/parse
      ONBOARDING_URL: http://mock_onboarding:9200/ingest
    volumes:
      - identity_data:/var/lib/identity
    depends_on:
      mock_ocr:
        condition: service_healthy
      mock_onboarding:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  mock_ocr:
    build: ../mock_ocr
    environment:
      OCR_SEED: ${OCR_SEED:-42}
      OCR_FAIL_RATE: ${OCR_FAIL_RATE:-0.20}
      OCR_HANG_RATE: ${OCR_HANG_RATE:-0.10}
      OCR_HANG_SECONDS: ${OCR_HANG_SECONDS:-600}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/online', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  mock_onboarding:
    build: ../mock_onboarding
    environment:
      ONBOARDING_SEED: ${ONBOARDING_SEED:-7}
      ONBOARDING_FAIL_RATE: ${ONBOARDING_FAIL_RATE:-0.20}
      ONBOARDING_LOST_RATE: ${ONBOARDING_LOST_RATE:-0.15}
      ONBOARDING_LOST_SECONDS: ${ONBOARDING_LOST_SECONDS:-120}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/online', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      mock_ocr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  identity_data:
