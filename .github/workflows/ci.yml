name: Tests and deployment
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest q1_api/
      - name: Build containers
        working-directory: q3_deploy
        run: |
          cp .env.example .env
          docker compose build
      - name: Verify deployment
        working-directory: q3_deploy
        run: |
          docker compose up -d --wait
          docker compose exec -T nginx nginx -t
          bash scripts/smoke_test.sh
          curl --fail http://localhost:8080/ocr/online
          status=$(head -c 6500000 /dev/zero | curl -s -o /dev/null -w '%{http_code}' --data-binary @- http://localhost:8080/api/batches)
          test "$status" = 413
          bash scripts/backup.sh
      - name: Logs
        if: always()
        working-directory: q3_deploy
        run: docker compose logs --no-color
