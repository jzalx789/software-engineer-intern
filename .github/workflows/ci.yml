name: Tests and deployment
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest q1_api/
      - name: Build containers
        working-directory: q3_deploy
        run: |
          cp .env.example .env
          docker compose build
      - name: Verify deployment
        working-directory: q3_deploy
        run: |
          docker compose up -d --wait
          docker compose exec -T nginx nginx -t
          bash scripts/smoke_test.sh
          status=$(curl -s -o /tmp/ocr-probe.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"case_id":"route-probe","image_ref":"badscan.jpg"}' http://localhost:8080/ocr/parse)
          test "$status" = 422
          python -c "import json; assert 'scan quality' in json.load(open('/tmp/ocr-probe.json'))['error']"
          status=$(head -c 6500000 /dev/zero | curl -s -o /dev/null -w '%{http_code}' --data-binary @- http://localhost:8080/api/batches)
          test "$status" = 413
          for index in $(seq 1 10); do bash scripts/backup.sh; done
          test "$(find backups -name 'backup-*.db' | wc -l)" -eq 7
          newest=$(ls -t backups/backup-*.db | head -1)
          docker compose stop api nginx
          docker compose run --rm -T --no-deps -v "$PWD/backups:/backup:ro" api python -c "import sqlite3; src=sqlite3.connect('file:/backup/$(basename "$newest")?mode=ro&immutable=1',uri=True); dst=sqlite3.connect('/var/lib/identity/service.db'); src.backup(dst); assert dst.execute('PRAGMA integrity_check').fetchone()[0]=='ok'; assert dst.execute('SELECT count(*) FROM cases').fetchone()[0]==43; dst.close(); src.close()"
          docker compose up -d --wait
          curl --fail http://localhost:8080/api/ready
      - name: Logs
        if: always()
        working-directory: q3_deploy
        run: docker compose logs --no-color
